<!--
  Login. Vista NUEVA: el prototipo React no tenia ninguna (DESIGN.md §7
  lista solo landing/list/dashboard/communities/profile).

  Sigue el lenguaje visual del proyecto: fondo negro, borde 4, Syne en
  mayusculas, esquinas rectas. Sin curvas ni sombras.
-->
<div class="min-h-screen bg-black text-white flex flex-col">
  <div class="flex-1 flex items-center justify-center px-6 py-24">
    <div class="w-full max-w-md">
      <a
        routerLink="/"
        class="inline-flex items-center gap-2 font-body font-bold uppercase text-xs tracking-widest opacity-70 hover:opacity-100 mb-8"
      >
        <svg lucideArrowLeft [size]="16" [strokeWidth]="3"></svg>
        Volver al inicio
      </a>

      <h1 class="font-display font-bold text-5xl sm:text-6xl uppercase tracking-tighter mb-2">
        ALLPACA
      </h1>
      <p class="font-signature text-4xl text-accent mb-10 animate-pulse-slow">Como nuevo</p>

      <h2 class="font-display font-bold text-2xl uppercase mb-6">Iniciar sesion</h2>

      @if (error(); as msg) {
        <div
          class="bg-accent text-black border-4 border-white px-4 py-3 font-body font-bold text-sm uppercase mb-6"
          role="alert"
        >
          {{ msg }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
        <label class="flex flex-col gap-2">
          <span class="font-body font-bold uppercase text-xs tracking-widest opacity-80">
            Correo electronico
          </span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="tu@correo.com"
            class="bg-transparent border-2 border-white px-4 py-3 font-body text-white placeholder:text-white/40 focus:outline-none focus:border-accent"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <span class="font-body text-xs uppercase text-accent">
              Escribe un correo valido
            </span>
          }
        </label>

        <label class="flex flex-col gap-2">
          <span class="font-body font-bold uppercase text-xs tracking-widest opacity-80">
            Contrasena
          </span>
          <input
            type="password"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
            class="bg-transparent border-2 border-white px-4 py-3 font-body text-white placeholder:text-white/40 focus:outline-none focus:border-accent"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <span class="font-body text-xs uppercase text-accent">
              Minimo 8 caracteres
            </span>
          }
        </label>

        <button
          type="submit"
          [disabled]="busy()"
          class="mt-2 w-full py-4 bg-white text-black border-4 border-white font-display font-bold uppercase text-xl hover:bg-black hover:text-white transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-3"
        >
          @if (busy()) {
            <svg lucideLoader [size]="20" [strokeWidth]="3"></svg>
            Entrando
          } @else {
            Entrar
          }
        </button>
      </form>

      <button
        type="button"
        (click)="fillDemo()"
        class="mt-4 w-full py-3 border-2 border-white/40 font-body font-bold uppercase text-xs tracking-widest hover:border-white hover:bg-white hover:text-black transition-colors"
      >
        Usar cuenta de prueba
      </button>

      <p class="mt-8 font-body text-sm uppercase opacity-70">
        No tienes cuenta?
        <a routerLink="/registro" class="text-accent font-bold underline underline-offset-4">
          Crear una
        </a>
      </p>
    </div>
  </div>
</div>
